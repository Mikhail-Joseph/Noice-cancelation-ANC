<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container with Safe Padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Center Shield Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#172336" stroke-width="6" stroke-dasharray="8 8" />

  <!-- Positive Sound Wave (Cyan) -->
  <path d="M 110 256 C 140 160, 180 160, 210 256 C 240 352, 280 352, 310 256 C 340 160, 380 160, 402 256" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Inverted Anti-Noise Wave (Amber) -->
  <path d="M 110 256 C 140 352, 180 352, 210 256 C 240 160, 280 160, 310 256 C 340 352, 380 352, 402 256" 
        fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 10" opacity="0.9" />

  <!-- Center Null Point Indicator (Emerald) -->
  <circle cx="256" cy="256" r="14" fill="#10b981" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />
</svg>
